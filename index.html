<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="KAIZURO — offshore performance equipment. A new generation is coming.">
<meta name="theme-color" content="#05080b">
<title>KAIZURO | Built for What's Next.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--white:#f5f5f2;--muted:rgba(245,245,242,.72);--line:rgba(245,245,242,.28);--bg:#030608}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--white);font-family:Inter,Arial,sans-serif}
body{overflow-x:hidden}
a{color:inherit;text-decoration:none}
.hero{position:relative;min-height:100svh;overflow:hidden;background:#05090c}
.hero-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center}
.hero:after{display:none}
.header{position:absolute;z-index:4;inset:0;pointer-events:none;padding:0;display:block}
.brand{display:none}
.category{display:none}
.instagram{position:absolute;top:2.5%;right:5%;width:16%;height:7%;display:block;opacity:0;pointer-events:auto}
.instagram svg{width:100%;height:100%}
.content{position:absolute;inset:0;z-index:4;width:100%;margin:0;padding:0;pointer-events:none}
.eyebrow{margin:0 0 22px;font-size:12px;font-weight:500;letter-spacing:.28em;text-transform:uppercase;color:rgba(245,245,242,.78)}
h1{margin:0;max-width:900px;font-size:clamp(62px,8.6vw,136px);font-weight:800;line-height:.88;letter-spacing:-.075em}
.lead{max-width:560px;margin:32px 0 0;font-size:19px;line-height:1.48;color:var(--muted);font-weight:300}
.capture{display:flex;width:36.6%;height:6.7%;margin:0;border:0;background:#05080b;backdrop-filter:none;position:absolute;left:31%;top:73.8%;pointer-events:auto;z-index:20;overflow:hidden}
.capture input{flex:1 1 auto;min-width:0;width:86%;height:100%;margin:0;border:0!important;outline:0!important;background:transparent!important;background-color:transparent!important;color:#fff!important;-webkit-text-fill-color:#fff!important;caret-color:#fff!important;padding:0 18px!important;font:600 18px/1 Inter,Arial,sans-serif!important;letter-spacing:.025em;appearance:none;-webkit-appearance:none;box-shadow:none!important;opacity:1!important;pointer-events:auto}
.capture input::placeholder{display:none!important;color:transparent!important;opacity:0!important}
.capture input:-webkit-autofill,.capture input:-webkit-autofill:hover,.capture input:-webkit-autofill:focus,.capture input:-webkit-autofill:active{background:transparent!important;background-color:transparent!important;color:#fff!important;-webkit-text-fill-color:#fff!important;-webkit-box-shadow:0 0 0 1000px transparent inset!important;box-shadow:0 0 0 1000px transparent inset!important}
.capture input:focus{background:transparent!important;background-color:transparent!important;outline:0!important;box-shadow:none!important;color:#fff!important;-webkit-text-fill-color:#fff!important}
.capture button{flex:0 0 14%;width:14%;height:100%;margin:0;border:0;background:#f5f5f2;color:#111;cursor:pointer;font-size:26px;line-height:1;pointer-events:auto;position:relative;z-index:21;padding:0}
.benefits{display:none}
.benefits i{width:3px;height:3px;border-radius:50%;background:rgba(245,245,242,.62)}
.bottom{display:none}
.tagline{display:flex;gap:18px;align-items:flex-start;font-size:13px;line-height:1.65;letter-spacing:.25em;text-transform:uppercase}
.tagline:before{content:"";width:38px;height:1px;background:var(--white);margin-top:9px;flex:none}
.footer{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:rgba(245,245,242,.55)}
@media(max-width:700px){
.header{padding:24px 22px}.brand{font-size:18px}.category{display:none}.instagram span{display:none}
.content{width:calc(100% - 44px);margin-left:22px;padding-top:155px}
h1{font-size:clamp(55px,15vw,82px);line-height:.9}.lead{font-size:16px;margin-top:24px}
.capture{width:100%;height:64px;margin-top:30px}.capture input{font-size:16px;padding:0 18px}.capture button{width:68px;font-size:27px}
.benefits{gap:9px;flex-wrap:wrap;line-height:1.6}.benefits i{display:none}
.bottom{left:22px;right:22px;bottom:22px;display:block}.tagline{font-size:10px;letter-spacing:.19em}.footer{margin-top:25px;font-size:9px}
}</style>
</head>
<body>
<main class="hero">
<img class="hero-bg" src="/assets/kaizuro-site/hero/kaizuro-website-hero-final.png" alt="Open ocean at sunset">
<div class="header">
<a class="brand" href="/">KAIZURO</a>
<div class="category">OVER-ENGINEERED ON PURPOSE.</div>
<a class="instagram" href="https://www.instagram.com/kaizuro_official/" target="_blank" rel="noopener noreferrer" aria-label="KAIZURO on Instagram">
<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.2" y="3.2" width="17.6" height="17.6" rx="5"/><circle cx="12" cy="12" r="4.1"/><circle cx="17.5" cy="6.6" r="1"/></svg>
<span>kaizuro_official</span>
</a>
</div>
<section class="content">
<form class="capture" action="/join" method="post">
<input type="email" name="email" autocomplete="off" placeholder="" aria-label="Your email address" required>
<button type="submit" aria-label="Join the KAIZURO list">→</button>
</form>
<div class="benefits"><span>BE FIRST TO KNOW</span><i></i><span>PRODUCT UPDATES</span><i></i><span>TESTING</span><i></i><span>FIRST RELEASE</span></div>
</section>
<div class="bottom">
<div class="tagline">OCEANS DEMAND MORE.<br>SO DO WE.</div>
<div class="footer">© 2026 KAIZURO</div>
</div>
</main>
</body>
</html>
