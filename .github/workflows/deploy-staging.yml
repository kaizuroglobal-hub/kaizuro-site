name: Deploy staging Worker

on:
  push:
    branches:
      - staging
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out staging
        uses: actions/checkout@v4
        with:
          ref: staging

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Remove accidental kaizuro-site Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          status=$(curl -sS -o /tmp/cf-delete.json -w "%{http_code}" \
            -X DELETE \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/kaizuro-site?force=true" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          if [ "$status" = "200" ] || [ "$status" = "404" ]; then
            echo "Accidental kaizuro-site Worker is absent."
          else
            cat /tmp/cf-delete.json
            exit 1
          fi

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.120.0 deploy --config wrangler.jsonc
