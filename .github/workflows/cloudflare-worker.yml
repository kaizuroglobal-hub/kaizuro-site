name: Deploy KAIZURO Cloudflare Worker

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Upload new Worker version
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: wrangler-output.ndjson
        run: npx --yes wrangler@4.120.0 versions upload --config wrangler.jsonc --message "${{ github.event.head_commit.message || github.sha }}"

      - name: Read uploaded version ID
        id: version
        shell: bash
        run: |
          VERSION_ID=$(node -e 'const fs=require("fs");const lines=fs.readFileSync("wrangler-output.ndjson","utf8").trim().split(/\n+/).map(JSON.parse);const item=[...lines].reverse().find(x=>x.type==="version-upload");if(!item?.version_id)process.exit(1);process.stdout.write(item.version_id)')
          echo "id=$VERSION_ID" >> "$GITHUB_OUTPUT"

      - name: Deploy uploaded version at 100 percent
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.120.0 versions deploy "${{ steps.version.outputs.id }}@100%" --config wrangler.jsonc -y --message "KAIZURO production ${{ github.sha }}"

      - name: Release 3 Sandbox smoke test
        shell: bash
        run: |
          for i in 1 2 3 4 5; do
            BODY=$(curl --fail --silent --show-error --max-time 20 "https://kaizuro.com/api/release3/smoke?order=KZO-B54E0ECF92") && break
            sleep 4
          done
          echo "$BODY"
          node -e 'const x=JSON.parse(process.argv[1]); if(!x.ok||!x.mathsValid||!x.emailBinding||!x.customerEmailPresent||!x.balanceRequestSupported) process.exit(1)' "$BODY"
