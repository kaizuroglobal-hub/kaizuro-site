media:
  input: assets/kaizuro-site/uploads
  output: /assets/kaizuro-site/uploads

content:
  - name: site
    label: Site Settings
    type: file
    path: content/site.json
    format: json
    fields:
      - { name: title, label: Browser tab title, type: string, required: true }
      - { name: description, label: Meta description, type: text, required: true }
      - { name: og_image, label: Social share image, type: image }

  - name: hero
    label: Hero Section
    type: file
    path: content/hero.json
    format: json
    fields:
      - { name: eyebrow, label: Eyebrow, type: string, required: true }
      - { name: title_line1, label: Title line 1, type: string, required: true }
      - { name: title_line2, label: Title line 2, type: string, required: true }
      - &rich { name: description, label: Description, type: rich-text, required: true, options: { format: html, media: false, switcher: false } }
      - { name: cta_discover_label, label: Primary CTA label, type: string, required: true }
      - { name: cta_discover_href, label: Primary CTA link, type: string, required: true }
      - { name: cta_join_label, label: Secondary CTA label, type: string, required: true }
      - { name: cta_join_href, label: Secondary CTA link, type: string, required: true }
      - { name: status_1, label: Status left, type: string, required: true }
      - { name: status_2, label: Status right, type: string, required: true }
      - { name: image_desktop_src, label: Desktop image, type: image, required: true }
      - { name: image_mobile_src, label: Mobile image, type: image, required: true }
      - { name: image_alt, label: Image alt text, type: string, required: true }

  - name: story
    label: Brand Story Section
    type: file
    path: content/story.json
    format: json
    fields:
      - { name: eyebrow, label: Eyebrow, type: string, required: true }
      - { name: title, label: Heading, type: string, required: true }
      - { <<: *rich, name: body_1, label: Body copy }
      - { <<: *rich, name: principles_text, label: Brand principles }
      - { name: image_src, label: Story image, type: image, required: true }
      - { name: image_alt, label: Image alt text, type: string, required: true }

  - name: assault
    label: ASSAULT Product Section
    type: file
    path: content/assault.json
    format: json
    fields:
      - { name: eyebrow, label: Eyebrow, type: string, required: true }
      - { name: title, label: Product title, type: string, required: true }
      - { name: lead, label: Lead sentence, type: string, required: true }
      - { <<: *rich, name: body, label: Body copy }
      - { name: tagline, label: Tagline, type: string, required: true }
      - { name: image_src, label: Product image, type: image, required: true }
      - { name: image_alt, label: Image alt text, type: string, required: true }

  - name: principles
    label: Design Principles 01–03
    type: file
    path: content/principles.json
    format: json
    fields:
      - { name: eyebrow, label: Eyebrow, type: string, required: true }
      - { name: title_line1, label: Heading line 1, type: string, required: true }
      - { name: title_line2, label: Heading line 2, type: string, required: true }
      - { <<: *rich, name: intro, label: Intro copy }
      - name: principles
        label: Principle cards 01–03
        type: list
        fields:
          - { name: number, label: Number, type: string, required: true }
          - { name: title, label: Title, type: string, required: true }
          - { <<: *rich, name: body, label: Description }

  - name: engineering
    label: Guide Architecture + Cards 01–04
    type: file
    path: content/engineering.json
    format: json
    fields:
      - { name: section_eyebrow, label: Eyebrow, type: string, required: true }
      - { name: section_title_line1, label: Heading line 1, type: string, required: true }
      - { name: section_title_line2, label: Heading line 2, type: string, required: true }
      - { <<: *rich, name: section_body, label: Body copy }
      - { name: section_tagline, label: Tagline, type: string, required: true }
      - { name: section_image_src, label: Section image, type: image, required: true }
      - { name: section_image_alt, label: Image alt text, type: string, required: true }
      - name: chapters
        label: Scrolling cards 01 Frame to 04 Power
        type: list
        fields:
          - { name: eyebrow, label: Number / eyebrow, type: string, required: true }
          - { name: title, label: Card title, type: string, required: true }
          - { <<: *rich, name: text, label: Desktop copy }
          - { <<: *rich, name: mobile_text, label: Mobile copy }
          - { name: image_src, label: Card image, type: image, required: true }
          - { name: image_alt, label: Image alt text, type: string, required: true }

  - name: grip
    label: Grip Geometry Section
    type: file
    path: content/grip.json
    format: json
    fields:
      - { name: eyebrow, label: Eyebrow, type: string, required: true }
      - { name: title, label: Heading, type: string, required: true }
      - { <<: *rich, name: body, label: Body copy }
      - name: features
        label: Grip features
        type: list
        fields:
          - { name: title, label: Feature title, type: string, required: true }
          - { <<: *rich, name: body, label: Feature copy }
      - { name: image_src, label: Grip image, type: image, required: true }
      - { name: image_alt, label: Image alt text, type: string, required: true }

  - name: reel
    label: Reel Interface Section
    type: file
    path: content/reel.json
    format: json
    fields:
      - { name: eyebrow, label: Eyebrow, type: string, required: true }
      - { name: title, label: Heading, type: string, required: true }
      - { <<: *rich, name: body_1, label: Body copy 1 }
      - { <<: *rich, name: body_2, label: Body copy 2 }
      - { name: note, label: Image note, type: string, required: true }
      - name: features
        label: Reel features
        type: list
        field: { name: feature, label: Feature, type: string }
      - { name: image_src, label: Reel image, type: image, required: true }
      - { name: image_alt, label: Image alt text, type: string, required: true }

  - name: proof
    label: Physical Validation Section
    type: file
    path: content/proof.json
    format: json
    fields:
      - { name: eyebrow, label: Eyebrow, type: string, required: true }
      - { name: title, label: Heading, type: string, required: true }
      - { <<: *rich, name: body, label: Body copy }
      - { name: metric_1_title, label: Metric 1 title, type: string, required: true }
      - { name: metric_1_body, label: Metric 1 description, type: text, required: true }
      - { name: metric_1_value, label: Metric 1 value, type: string, required: true }
      - { name: metric_2_title, label: Metric 2 title, type: string, required: true }
      - { name: metric_2_body, label: Metric 2 description, type: text, required: true }
      - { name: metric_2_value, label: Metric 2 value, type: string, required: true }
      - { name: curve_heading, label: Curve heading, type: string, required: true }
      - { name: disclosure, label: Disclosure, type: text, required: true }

  - name: specifications
    label: Rod Specifications Section
    type: file
    path: content/specifications.json
    format: json
    fields:
      - { name: eyebrow, label: Eyebrow, type: string, required: true }
      - { name: title_line1, label: Heading line 1, type: string, required: true }
      - { name: title_line2, label: Heading line 2, type: string, required: true }
      - { <<: *rich, name: summary, label: Summary }
      - name: items
        label: Specification rows
        type: list
        fields:
          - { name: label, label: Specification, type: string, required: true }
          - { name: value, label: Value, type: string, required: true }
      - { <<: *rich, name: note, label: Pre-production note }

  - name: founder
    label: Founder 100 Section
    type: file
    path: content/founder.json
    format: json
    fields:
      - { name: eyebrow, label: Eyebrow, type: string, required: true }
      - { name: allocation_label, label: Allocation label, type: string, required: true }
      - { name: allocation_count, label: Allocation count, type: string, required: true }
      - { name: title, label: Main heading, type: string, required: true }
      - { name: subhead_line1, label: Subheading line 1, type: string, required: true }
      - { name: subhead_line2, label: Subheading line 2, type: string, required: true }
      - { <<: *rich, name: body_1, label: Body copy 1 }
      - { <<: *rich, name: body_2, label: Body copy 2 }
      - { name: cta_label, label: CTA label, type: string, required: true }
      - { name: deposit_eyebrow, label: Deposit eyebrow, type: string, required: true }
      - { name: deposit_title, label: Deposit heading, type: string, required: true }
      - { <<: *rich, name: deposit_body, label: Deposit instructions }
      - { name: deposit_step_1, label: Step 1, type: string, required: true }
      - { name: deposit_step_2, label: Step 2, type: string, required: true }
      - { name: deposit_step_3, label: Step 3, type: string, required: true }
      - { name: payment_secure_label, label: Secure checkout label, type: string, required: true }
      - { name: form_contact_email, label: Contact email, type: string, required: true }
      - { <<: *rich, name: closing_line, label: Closing statement }

  - name: halo
    label: HALO Section & Updates
    type: file
    path: content/halo.json
    format: json
    fields:
      - { name: eyebrow, label: Eyebrow, type: string, required: true }
      - { name: title_line1, label: Heading line 1, type: string, required: true }
      - { name: title_line2, label: Heading line 2, type: string, required: true }
      - { <<: *rich, name: body, label: Body copy }
      - { name: cta_label, label: CTA label, type: string, required: true }
      - { name: cta_href, label: CTA link, type: string, required: true }
      - { name: image_src, label: Background image, type: image, required: true }
      - { name: image_alt, label: Image alt text, type: string, required: true }
      - { name: updates_eyebrow, label: Updates eyebrow, type: string, required: true }
      - { name: updates_title, label: Updates heading, type: string, required: true }
      - { <<: *rich, name: updates_body, label: Updates body copy }
      - { name: updates_cta_label, label: Submit button label, type: string, required: true }
      - { name: updates_privacy_note, label: Privacy note, type: string, required: true }

  - name: footer
    label: Footer
    type: file
    path: content/footer.json
    format: json
    fields:
      - { name: brand_name, label: Brand name, type: string, required: true }
      - { name: brand_tagline, label: Brand tagline, type: string, required: true }
      - { name: copyright, label: Copyright text, type: string, required: true }
      - { name: contact_email, label: Contact email, type: string, required: true }
