media:
  input: assets/kaizuro-site
  output: /assets/kaizuro-site
  rename: safe
  categories: [image]

content:
  - name: site
    label: "01 · Site Settings, Header & SEO"
    type: file
    path: content/site.json
    format: json
    fields:
      - { name: title, label: "Browser title", type: string }
      - { name: description, label: "Meta description", type: text }
      - { name: og_image, label: "Social sharing image", type: image }

  - name: hero
    label: "02 · Hero"
    type: file
    path: content/hero.json
    format: json
    fields:
      - { name: eyebrow, label: "Eyebrow", type: string }
      - { name: title_line1, label: "Title line 1", type: string }
      - { name: title_line2, label: "Title line 2", type: string }
      - { name: description, label: "Description", type: rich-text, options: { format: html, media: false, switcher: false } }
      - { name: cta_discover_label, label: "Primary button label", type: string }
      - { name: cta_discover_href, label: "Primary destination", type: string }
      - { name: cta_join_label, label: "Secondary button label", type: string }
      - { name: cta_join_href, label: "Secondary destination", type: string }
      - { name: status_1, label: "Status 1", type: string }
      - { name: status_2, label: "Status 2", type: string }
      - { name: image_desktop_src, label: "Desktop image", type: image }
      - { name: image_mobile_src, label: "Mobile image", type: image }
      - { name: image_alt, label: "Image alt text", type: string }

  - name: story
    label: "03 · Why KAIZURO"
    type: file
    path: content/story.json
    format: json
    fields:
      - { name: eyebrow, label: "Eyebrow", type: string }
      - { name: title, label: "Heading", type: string }
      - { name: body_1, label: "Body copy", type: rich-text, options: { format: html, media: false, switcher: false } }
      - { name: principles_text, label: "Three principle blocks", type: rich-text, options: { format: html, media: false, switcher: false } }
      - { name: image_src, label: "Image", type: image }
      - { name: image_alt, label: "Image alt text", type: string }

  - name: assault
    label: "04 · ASSAULT PE6-8"
    type: file
    path: content/assault.json
    format: json
    fields:
      - { name: eyebrow, label: "Eyebrow", type: string }
      - { name: title, label: "Heading", type: string }
      - { name: lead, label: "Lead sentence", type: string }
      - { name: body, label: "Body copy", type: rich-text, options: { format: html, media: false, switcher: false } }
      - { name: tagline, label: "Tagline", type: string }
      - { name: image_src, label: "Image", type: image }
      - { name: image_alt, label: "Image alt text", type: string }

  - name: principles
    label: "05 · Design Principles 01–03"
    type: file
    path: content/principles.json
    format: json
    fields:
      - { name: eyebrow, label: "Eyebrow", type: string }
      - { name: title_line1, label: "Heading line 1", type: string }
      - { name: title_line2, label: "Heading line 2", type: string }
      - { name: intro, label: "Introduction", type: rich-text, options: { format: html, media: false, switcher: false } }
      - name: principles
        label: "Principle cards"
        type: list
        fields:
          - { name: number, label: "Number", type: string }
          - { name: title, label: "Title", type: string }
          - { name: body, label: "Description", type: rich-text, options: { format: html, media: false, switcher: false } }

  - name: engineering
    label: "06 · Component Architecture"
    type: file
    path: content/engineering.json
    format: json
    fields:
      - { name: section_eyebrow, label: "Eyebrow", type: string }
      - { name: section_title_line1, label: "Heading line 1", type: string }
      - { name: section_title_line2, label: "Heading line 2", type: string }
      - { name: section_body, label: "Body copy", type: rich-text, options: { format: html, media: false, switcher: false } }
      - { name: section_tagline, label: "Tagline", type: string }
      - { name: section_image_src, label: "Image", type: image }
      - { name: section_image_alt, label: "Image alt text", type: string }

  - name: scrolling_cards
    label: "07 · Scrolling Cards 01–04"
    type: file
    path: content/scrolling_cards.json
    format: json
    fields:
      - name: cards
        label: "All four cards"
        type: list
        fields:
          - { name: eyebrow, label: "Number and label", type: string }
          - { name: title, label: "Heading", type: string }
          - { name: text, label: "Desktop copy", type: rich-text, options: { format: html, media: false, switcher: false } }
          - { name: mobile_text, label: "Mobile copy", type: rich-text, options: { format: html, media: false, switcher: false } }
          - { name: image_src, label: "Image", type: image }
          - { name: image_alt, label: "Image alt text", type: string }

  - name: grip
    label: "08 · Grip Geometry"
    type: file
    path: content/grip.json
    format: json
    fields:
      - { name: eyebrow, label: "Eyebrow", type: string }
      - { name: title, label: "Heading", type: string }
      - { name: body, label: "Body copy", type: rich-text, options: { format: html, media: false, switcher: false } }
      - name: features
        label: "Feature points"
        type: list
        fields:
          - { name: title, label: "Feature heading", type: string }
          - { name: body, label: "Feature copy", type: rich-text, options: { format: html, media: false, switcher: false } }
      - { name: image_src, label: "Image", type: image }
      - { name: image_alt, label: "Image alt text", type: string }

  - name: reel
    label: "09 · Reel Interface"
    type: file
    path: content/reel.json
    format: json
    fields:
      - { name: eyebrow, label: "Eyebrow", type: string }
      - { name: title, label: "Heading", type: string }
      - { name: body_1, label: "Body copy 1", type: rich-text, options: { format: html, media: false, switcher: false } }
      - { name: body_2, label: "Body copy 2", type: rich-text, options: { format: html, media: false, switcher: false } }
      - { name: note, label: "Disclosure note", type: string }
      - { name: features, label: "Feature points", type: list, field: { name: value, label: "Feature", type: string } }
      - { name: image_src, label: "Image", type: image }
      - { name: image_alt, label: "Image alt text", type: string }

  - name: proof
    label: "10 · Proof & Testing"
    type: file
    path: content/proof.json
    format: json
    fields:
      - { name: eyebrow, label: "Eyebrow", type: string }
      - { name: title, label: "Heading", type: string }
      - { name: body, label: "Body copy", type: rich-text, options: { format: html, media: false, switcher: false } }
      - { name: metric_1_title, label: "Metric 1 heading", type: string }
      - { name: metric_1_body, label: "Metric 1 description", type: string }
      - { name: metric_1_value, label: "Metric 1 value", type: string }
      - { name: metric_2_title, label: "Metric 2 heading", type: string }
      - { name: metric_2_body, label: "Metric 2 description", type: string }
      - { name: metric_2_value, label: "Metric 2 value", type: string }
      - { name: curve_heading, label: "Curve heading", type: string }
      - { name: disclosure, label: "Disclosure", type: text }

  - name: specifications
    label: "11 · Specifications"
    type: file
    path: content/specifications.json
    format: json
    fields:
      - { name: eyebrow, label: "Eyebrow", type: string }
      - { name: title_line1, label: "Heading line 1", type: string }
      - { name: title_line2, label: "Heading line 2", type: string }
      - { name: summary, label: "Summary", type: rich-text, options: { format: html, media: false, switcher: false } }
      - name: items
        label: "Specification rows"
        type: list
        fields:
          - { name: label, label: "Specification", type: string }
          - { name: value, label: "Value", type: string }
      - { name: note, label: "Specification note", type: rich-text, options: { format: html, media: false, switcher: false } }

  - name: evolution
    label: "12 · Road to Production 01–07"
    type: file
    path: content/evolution.json
    format: json
    fields:
      - { name: eyebrow, label: "Eyebrow", type: string }
      - { name: title, label: "Heading", type: string }
      - { name: body, label: "Introduction", type: rich-text, options: { format: html, media: false, switcher: false } }
      - name: steps
        label: "Development stages"
        type: list
        fields:
          - { name: number, label: "Number", type: string }
          - { name: title, label: "Stage title", type: string }
          - { name: body, label: "Description", type: rich-text, options: { format: html, media: false, switcher: false } }
      - { name: closing_line, label: "Closing statement", type: string }

  - name: founder
    label: "13 · Founder 100 Introduction"
    type: file
    path: content/founder.json
    format: json
    fields:
      - { name: eyebrow, label: "Eyebrow", type: string }
      - { name: allocation_label, label: "Allocation label", type: string }
      - { name: allocation_count, label: "Allocation count", type: string }
      - { name: title, label: "Heading", type: string }
      - { name: subhead_line1, label: "Subheading line 1", type: string }
      - { name: subhead_line2, label: "Subheading line 2", type: string }
      - { name: body_1, label: "Body copy 1", type: rich-text, options: { format: html, media: false, switcher: false } }
      - { name: body_2, label: "Body copy 2", type: rich-text, options: { format: html, media: false, switcher: false } }
      - { name: cta_label, label: "CTA label", type: string }

  - name: founder_pack
    label: "14 · Founder Pack & Choices"
    type: file
    path: content/founder_pack.json
    format: json
    fields:
      - { name: eyebrow, label: "Eyebrow", type: string }
      - { name: title, label: "Heading", type: string }
      - { name: body, label: "Introduction", type: rich-text, options: { format: html, media: false, switcher: false } }
      - { name: cap_heading, label: "Cap heading", type: string }
      - { name: cap_subheading, label: "Cap subheading", type: string }
      - name: caps
        label: "Cap choices"
        type: list
        fields:
          - { name: name, label: "Name", type: string }
          - { name: image_src, label: "Image", type: image }
          - { name: image_alt, label: "Image alt text", type: string }
      - { name: pack_heading, label: "Pack heading", type: string }
      - { name: pack_subheading, label: "Pack subheading", type: string }
      - name: packs
        label: "Pack choices"
        type: list
        fields:
          - { name: name, label: "Name", type: string }
          - { name: image_src, label: "Image", type: image }
          - { name: image_alt, label: "Image alt text", type: string }
      - { name: included_heading, label: "Included heading", type: string }
      - { name: included_items, label: "Included items", type: list, field: { name: value, label: "Item", type: string } }

  - name: founder_payment
    label: "15 · Rod Selection & Payment"
    type: file
    path: content/founder_payment.json
    format: json
    fields:
      - { name: eyebrow, label: "Eyebrow", type: string }
      - { name: title, label: "Heading", type: string }
      - { name: body, label: "Instructions", type: rich-text, options: { format: html, media: false, switcher: false } }
      - { name: steps, label: "Payment steps", type: list, field: { name: value, label: "Step", type: string } }
      - name: products
        label: "Rod payment cards"
        type: list
        fields:
          - { name: model, label: "Model", type: string }
          - { name: rating, label: "PE rating", type: string }
          - { name: kicker, label: "Card label", type: string }
          - { name: price, label: "Founder price", type: string }
          - { name: currency, label: "Currency", type: string }
          - { name: deposit_label, label: "Deposit label", type: string }
          - { name: deposit, label: "Deposit amount", type: string }
          - { name: balance_label, label: "Balance label", type: string }
          - { name: balance, label: "Balance amount", type: string }
          - { name: secure_label, label: "Security label", type: string }
          - { name: button_label, label: "Button label", type: string }
          - { name: checkout_url, label: "Square checkout URL", type: string }

  - name: founder_form
    label: "16 · Founder Form"
    type: file
    path: content/founder_form.json
    format: json
    fields:
      - { name: heading, label: "Form heading", type: string }
      - { name: action_email, label: "Destination email", type: string }
      - { name: subject, label: "Email subject", type: string }
      - name: fields
        label: "Contact fields"
        type: list
        fields:
          - { name: label, label: "Label", type: string }
          - { name: name, label: "Submitted field name", type: string }
          - { name: type, label: "Input type", type: string }
          - { name: required, label: "Required", type: boolean }
          - { name: placeholder, label: "Placeholder", type: string }
      - { name: rod_label, label: "Rod field label", type: string }
      - { name: rod_options, label: "Rod choices", type: list, field: { name: value, label: "Choice", type: string } }
      - { name: cap_label, label: "Cap field label", type: string }
      - { name: cap_options, label: "Cap choices", type: list, field: { name: value, label: "Choice", type: string } }
      - { name: pack_label, label: "Pack field label", type: string }
      - { name: pack_options, label: "Pack choices", type: list, field: { name: value, label: "Choice", type: string } }
      - { name: notes_label, label: "Notes label", type: string }
      - { name: notes_placeholder, label: "Notes placeholder", type: string }
      - { name: consent, label: "Consent statement", type: text }
      - { name: submit_label, label: "Submit button label", type: string }

  - name: founder_delivery
    label: "17 · Founder Delivery Roadmap"
    type: file
    path: content/founder_delivery.json
    format: json
    fields:
      - { name: eyebrow, label: "Eyebrow", type: string }
      - { name: title, label: "Heading", type: string }
      - { name: body, label: "Introduction", type: rich-text, options: { format: html, media: false, switcher: false } }
      - name: milestones
        label: "Delivery milestones"
        type: list
        fields:
          - { name: number, label: "Number", type: string }
          - { name: title, label: "Milestone title", type: string }
          - { name: body, label: "Description", type: rich-text, options: { format: html, media: false, switcher: false } }

  - name: terms
    label: "18 · FAQ & Commercial Terms"
    type: file
    path: content/terms.json
    format: json
    fields:
      - { name: eyebrow, label: "Eyebrow", type: string }
      - { name: title, label: "Heading", type: string }
      - name: items
        label: "Questions and answers"
        type: list
        fields:
          - { name: open, label: "Open by default", type: boolean }
          - { name: question, label: "Question", type: string }
          - { name: answer, label: "Answer", type: rich-text, options: { format: html, media: false, switcher: false } }

  - name: halo
    label: "19 · HALO Preview & Follow the Build"
    type: file
    path: content/halo.json
    format: json
    fields:
      - { name: eyebrow, label: "HALO eyebrow", type: string }
      - { name: title_line1, label: "Heading line 1", type: string }
      - { name: title_line2, label: "Heading line 2", type: string }
      - { name: body, label: "Body copy", type: rich-text, options: { format: html, media: false, switcher: false } }
      - { name: cta_label, label: "CTA label", type: string }
      - { name: cta_href, label: "CTA destination", type: string }
      - { name: image_src, label: "Image", type: image }
      - { name: image_alt, label: "Image alt text", type: string }
      - { name: updates_eyebrow, label: "Updates eyebrow", type: string }
      - { name: updates_title, label: "Updates heading", type: string }
      - { name: updates_body, label: "Updates body", type: rich-text, options: { format: html, media: false, switcher: false } }
      - { name: updates_cta_label, label: "Updates button label", type: string }
      - { name: updates_privacy_note, label: "Privacy note", type: string }

  - name: footer
    label: "20 · Footer"
    type: file
    path: content/footer.json
    format: json
    fields:
      - { name: brand_name, label: "Brand name", type: string }
      - { name: brand_tagline, label: "Brand tagline", type: string }
      - { name: copyright, label: "Copyright line", type: string }
      - { name: contact_email, label: "Contact email", type: string }

  - name: blank_action
    label: "90 · PLANNED / NOT LIVE — Blank & Action"
    type: file
    path: content/blank_action.json
    format: json
    fields:
      - { name: eyebrow, label: "Eyebrow", type: string }
      - { name: title, label: "Heading", type: string }
      - { name: body, label: "Body copy", type: rich-text, options: { format: html, media: false, switcher: false } }
      - name: features
        label: "Performance points"
        type: list
        fields:
          - { name: title, label: "Heading", type: string }
          - { name: body, label: "Description", type: rich-text, options: { format: html, media: false, switcher: false } }
      - { name: closing_line, label: "Closing statement", type: string }

  - name: warranty_support
    label: "91 · PLANNED / NOT LIVE — Warranty & Support"
    type: file
    path: content/warranty_support.json
    format: json
    fields:
      - { name: eyebrow, label: "Eyebrow", type: string }
      - { name: title, label: "Heading", type: string }
      - { name: body, label: "Introduction", type: rich-text, options: { format: html, media: false, switcher: false } }
      - name: items
        label: "Support points"
        type: list
        fields:
          - { name: title, label: "Heading", type: string }
          - { name: body, label: "Description", type: rich-text, options: { format: html, media: false, switcher: false } }
      - { name: contact_label, label: "Contact button label", type: string }
      - { name: contact_href, label: "Contact destination", type: string }

  - name: advanced
    label: "99 · Advanced Site Controls"
    type: file
    path: content/advanced.json
    format: json
    fields:
      - { name: enabled, label: "Enable advanced controls", type: boolean }
      - { name: notes, label: "Internal notes", type: text }
      - name: element_rules
        label: "Element override and removal rules"
        type: list
        fields:
          - { name: enabled, label: "Rule enabled", type: boolean }
          - { name: selector, label: "CSS selector", type: string }
          - { name: action, label: "Action", type: string }
          - { name: attribute, label: "Attribute / class / CSS property", type: string }
          - { name: value, label: "New value", type: text }
      - name: css_variables
        label: "Global CSS variables"
        type: list
        fields:
          - { name: name, label: "Variable name", type: string }
          - { name: value, label: "Value", type: string }
      - { name: custom_css, label: "Custom CSS", type: code, options: { language: css } }
      - { name: custom_javascript, label: "Custom JavaScript", type: code, options: { language: javascript } }